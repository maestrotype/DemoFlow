<div class="project-card">
  <div class="project-card__thumbnail">
    <img *ngIf="project().thumbnail" [src]="project().thumbnail?.url" [alt]="project().thumbnail?.alt" />
    <div *ngIf="!project().thumbnail" class="project-card__placeholder">
      <span class="project-card__placeholder-icon">🎬</span>
    </div>
  </div>
  <div class="project-card__content">
    <h3 class="project-card__title">{{ project().title }}</h3>
    <p class="project-card__description">{{ project().description }}</p>
    <div class="project-card__meta">
      <span class="project-card__scene-count">{{ project().sceneCount }} scenes</span>
      <span class="project-card__duration">{{ project().durationMs | duration }}</span>
    </div>
    <div class="project-card__status">
      <app-badge [status]="project().status">{{ project().status }}</app-badge>
    </div>
  </div>
</div>
